<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIGEN404 合成 Score 比較</title>
<style>body{max-width:920px;margin:32px auto;padding:0 20px;font:16px/1.7 system-ui;color:#203044;background:#f7f9fc}button,select{font:inherit;padding:8px;margin:4px}button[aria-pressed=true]{background:#174d7a;color:white}.card{background:white;border:1px solid #cad5df;border-radius:12px;padding:18px;margin:12px 0}.bar{background:#246c98;height:16px;border-radius:4px}.muted{color:#566374}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}svg{max-width:100%;height:340px}summary{cursor:pointer}</style>
<h1>根拠の強さの表示を比較</h1><p><strong>合成 fixture・採用未定</strong>。値は本心の確率や診断値ではありません。閾値にも検証された意味はありません。</p>
<div id="variants" aria-label="表示候補"></div><label for="levels">F の段階数</label><select id="levels"><option value="3">3 段階</option><option value="5">5 段階</option></select>
<main id="content" aria-live="polite"></main><p class="muted">同じ相談と理由を固定して、確率への誤解・理由の発見・次の行動・不確実性の理解を比較してください。Production UI への適用はありません。</p>
<script>
const data=[['怒り気味',40,'明確な怒りの言葉はない一方、返答が短い。'],['冷たい',55,'普段との比較はできないが、返答が短い。'],['距離あり',45,'会話を切り上げた可能性がある。'],['忙しい',65,'返信に時間がかかっている。'],['淡々',60,'返答に補足がなく短い。'],['大丈夫',35,'拒絶や非難を示す明確な言葉はない。']];
const names=['A Radar','B 横棒＋理由','C カード＋理由','D 文章＋数値折りたたみ','E 文章のみ','F 段階表示'];let selected=0;
const intro='<div class="card"><h2>入力だけでは、感情を一つに決められません</h2><p>短い返答には忙しさなど複数の説明が残っています。普段の返信速度や当日の事情は不明です。</p></div>';
const reasons=()=>data.map(([label,score,reason])=>`<section class="card"><h3>${label}</h3><p>${reason}</p></section>`).join('');
function radar(){const point=(v,i)=>{const a=-Math.PI/2+i*Math.PI/3;return [220+Math.cos(a)*v,170+Math.sin(a)*v]};return '<svg viewBox="0 0 440 340" role="img" aria-label="合成された六指標のRadar。詳しい理由は続く文章にあります。">'+[30,60,90,120].map(r=>'<polygon fill="none" stroke="#cad5df" points="'+data.map((_,i)=>point(r,i).join(',')).join(' ')+'"/>').join('')+'<polygon fill="#246c9833" stroke="#246c98" points="'+data.map((d,i)=>point(d[1]*1.2,i).join(',')).join(' ')+'"/>'+data.map((d,i)=>{const p=point(145,i);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle">${d[0]} ${d[1]}</text>`}).join('')+'</svg>';}
function render(){document.querySelectorAll('#variants button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));let body='';if(selected===0)body=radar()+reasons();if(selected===1)body=data.map(([l,s,r])=>`<section class="card"><h3>${l} ${s}/100</h3><div class="bar" style="width:${s}%" aria-hidden="true"></div><p>${r}</p></section>`).join('');if(selected===2)body='<div class="grid">'+data.map(([l,s,r])=>`<section class="card"><h3>${l} ${s}/100</h3><p>${r}</p></section>`).join('')+'</div>';if(selected===3)body=reasons()+'<details class="card"><summary>参考数値を表示</summary>'+data.map(([l,s])=>`<p>${l}: ${s}/100</p>`).join('')+'</details>';if(selected===4)body=reasons();if(selected===5){const n=Number(document.getElementById('levels').value);body=data.map(([l,s,r])=>`<section class="card"><h3>${l}: ${Math.min(n,Math.floor(s/100*n)+1)} / ${n} 段階（仮の境界）</h3><p>${r}</p></section>`).join('');}document.getElementById('content').innerHTML=intro+body;}
names.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=()=>{selected=i;render()};document.getElementById('variants').append(b)});document.getElementById('levels').onchange=render;render();
</script></html>
